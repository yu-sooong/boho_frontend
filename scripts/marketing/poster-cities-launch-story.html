<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>補亦樂乎 · 新北高雄即將上線（直式）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --teal: #0f766e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 40% at 50% 18%, rgba(16, 185, 129, 0.2), transparent 60%),
        radial-gradient(ellipse 60% 35% at 80% 80%, rgba(15, 118, 110, 0.12), transparent 55%),
        linear-gradient(180deg, #f0fdfa 0%, #f8fafc 45%, #ecfdf5 100%);
      position: relative;
    }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 72px;
      text-align: center;
      opacity: 0;
    }
    .s1 { animation: scene1 9s ease-in-out infinite; }
    .s2 { animation: scene2 9s ease-in-out infinite; }
    .s3 { animation: scene3 9s ease-in-out infinite; }
    .s4 { animation: scene4 9s ease-in-out infinite; }
    @keyframes scene1 {
      0%, 2% { opacity: 0; transform: translateY(16px); }
      6%, 20% { opacity: 1; transform: translateY(0); }
      26%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes scene2 {
      0%, 22% { opacity: 0; transform: translateY(16px); }
      28%, 48% { opacity: 1; transform: translateY(0); }
      54%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes scene3 {
      0%, 50% { opacity: 0; transform: translateY(16px); }
      56%, 74% { opacity: 1; transform: translateY(0); }
      80%, 100% { opacity: 0; transform: translateY(-12px); }
    }
    @keyframes scene4 {
      0%, 76% { opacity: 0; transform: translateY(16px); }
      82%, 96% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .logo { width: 140px; height: 140px; margin-bottom: 28px; }
    .brand { font-size: 64px; font-weight: 900; letter-spacing: -0.03em; }
    .eyebrow {
      margin-top: 16px;
      font-size: 28px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: 0.04em;
    }
    .headline {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.2;
      text-wrap: balance;
    }
    .sub {
      margin-top: 22px;
      font-size: 30px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.5;
      max-width: 820px;
    }
    .cities {
      margin-top: 48px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: min(720px, 100%);
    }
    .city {
      background: #fff;
      border-radius: 28px;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 16px 40px rgba(15, 118, 110, 0.1);
      border: 1px solid rgba(15, 118, 110, 0.1);
      text-align: left;
    }
    .city h3 { font-size: 40px; font-weight: 900; }
    .badge {
      font-size: 22px;
      font-weight: 800;
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 999px;
      padding: 10px 18px;
    }
    .chips {
      margin-top: 44px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: min(760px, 100%);
    }
    .chip {
      background: #fff;
      border-radius: 20px;
      padding: 22px 18px;
      font-size: 28px;
      font-weight: 800;
      color: var(--teal);
      border: 1px solid rgba(15, 118, 110, 0.14);
      box-shadow: 0 10px 28px rgba(15, 118, 110, 0.08);
    }
    .cta {
      margin-top: 44px;
      display: inline-flex;
      min-height: 84px;
      align-items: center;
      padding: 0 48px;
      border-radius: 20px;
      background: var(--teal);
      color: #fff;
      font-size: 34px;
      font-weight: 900;
      box-shadow: 0 18px 44px rgba(15, 118, 110, 0.28);
    }
    .url {
      margin-top: 22px;
      font-size: 30px;
      font-weight: 800;
      color: var(--muted);
    }
    .note {
      margin-top: 16px;
      font-size: 22px;
      font-weight: 600;
      color: #64748b;
    }
  </style>
</head>
<body>
  <section class="scene s1">
    <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 18,8 L 38,8 L 38,48 A 30,30 0 0,1 18,62 Z" fill="#1e293b"/>
      <path d="M 38,22 L 54,22 A 34,34 0 0,1 88,56 A 34,34 0 0,1 54,90 L 38,90 L 38,68 L 54,68 A 12,12 0 0,0 66,56 A 12,12 0 0,0 54,44 L 38,44 Z" fill="#1e293b"/>
      <path d="M 26,74 L 30,74 L 30,90 L 26,90 Z" fill="#10b981"/>
      <path d="M 27,74 C 14,74 10,63 12,56 C 18,56 26,64 27,74 Z" fill="#10b981"/>
      <path d="M 29,72 C 42,65 46,52 45,44 C 35,46 28,59 29,72 Z" fill="#10b981"/>
    </svg>
    <h1 class="brand">補亦樂乎</h1>
    <p class="eyebrow">補習班情報地圖</p>
    <p class="sub">先看立案與稽查，再決定要不要報名</p>
  </section>

  <section class="scene s2">
    <p class="eyebrow" style="margin-bottom:18px">範圍擴大中</p>
    <h2 class="headline">新北市、高雄市<br>即將上線</h2>
    <div class="cities">
      <div class="city"><h3>新北市</h3><span class="badge">即將上線</span></div>
      <div class="city"><h3>高雄市</h3><span class="badge">即將上線</span></div>
    </div>
  </section>

  <section class="scene s3">
    <h2 class="headline">同一個查詢流程</h2>
    <p class="sub">先選縣市，再用地圖找班、核對公開資訊</p>
    <div class="chips">
      <span class="chip">選縣市</span>
      <span class="chip">地圖找班</span>
      <span class="chip">立案狀態</span>
      <span class="chip">稽查紀錄</span>
    </div>
  </section>

  <section class="scene s4">
    <h2 class="headline">台中已開放查詢</h2>
    <p class="sub">新北、高雄資料匯入中<br>開放後直接切換就能用</p>
    <div class="cta">打開地圖看看</div>
    <div class="url">boho.yujii.app</div>
    <p class="note">不業配・不賣置頂・公開資料優先</p>
  </section>
</body>
</html>
