<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080" />
  <title>補亦樂乎 · 地區教育情報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --teal: #0f766e;
      --emerald: #10b981;
      --bg0: #ecfdf5;
      --bg1: #f0fdfa;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 55% 45% at 18% 22%, rgba(16, 185, 129, 0.18), transparent 60%),
        radial-gradient(ellipse 50% 40% at 88% 78%, rgba(15, 118, 110, 0.14), transparent 55%),
        linear-gradient(160deg, var(--bg1) 0%, #f8fafc 42%, var(--bg0) 100%);
      position: relative;
    }
    .orb {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.2), transparent 68%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: orbPulse 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes orbPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.65; }
      50% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 72px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
    }
    .s1 { animation: scene1 9s ease-in-out infinite; }
    .s2 { animation: scene2 9s ease-in-out infinite; }
    .s3 { animation: scene3 9s ease-in-out infinite; }
    .s4 { animation: scene4 9s ease-in-out infinite; }
    @keyframes scene1 {
      0%, 2% { opacity: 0; transform: translateY(12px); }
      6%, 20% { opacity: 1; transform: translateY(0); }
      26%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes scene2 {
      0%, 22% { opacity: 0; transform: translateY(16px); }
      28%, 48% { opacity: 1; transform: translateY(0); }
      54%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes scene3 {
      0%, 50% { opacity: 0; transform: translateY(16px); }
      56%, 74% { opacity: 1; transform: translateY(0); }
      80%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes scene4 {
      0%, 76% { opacity: 0; transform: translateY(16px); }
      82%, 96% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .logo {
      width: 112px;
      height: 112px;
      margin-bottom: 18px;
      filter: drop-shadow(0 12px 28px rgba(15, 23, 42, 0.1));
    }
    .brand {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .eyebrow {
      margin-top: 14px;
      font-size: 22px;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: 0.04em;
    }
    .headline {
      font-size: 50px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.2;
      text-wrap: balance;
      max-width: 900px;
    }
    .sub {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.45;
      max-width: 800px;
    }

    /* 密度地圖示意 */
    .map-card {
      margin-top: 28px;
      width: 860px;
      background: var(--card);
      border: 1px solid rgba(15, 118, 110, 0.12);
      border-radius: 24px;
      padding: 28px 32px 24px;
      box-shadow: 0 18px 48px rgba(15, 118, 110, 0.12);
      text-align: left;
    }
    .map-card .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
    }
    .map-card .title {
      font-size: 26px;
      font-weight: 900;
    }
    .map-card .hint {
      font-size: 18px;
      font-weight: 700;
      color: #64748b;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }
    .cell {
      height: 88px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      border: 2px solid transparent;
    }
    .c1 { background: #ecfdf5; }
    .c2 { background: #d1fae5; }
    .c3 { background: #a7f3d0; }
    .c4 { background: #6ee7b7; }
    .c5 { background: #34d399; color: #064e3b; }
    .cell.pick {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.18);
      animation: pickPulse 1.4s ease-in-out infinite;
    }
    .cell .n {
      font-size: 22px;
      font-weight: 900;
      margin-top: 2px;
    }
    @keyframes pickPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .legend {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #64748b;
    }
    .legend-bar {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ecfdf5, #34d399);
    }

    /* 本區重點 */
    .metrics {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      width: 920px;
    }
    .metric {
      background: var(--card);
      border: 1px solid rgba(15, 118, 110, 0.12);
      border-radius: 22px;
      padding: 28px 22px;
      box-shadow: 0 14px 36px rgba(15, 118, 110, 0.1);
      text-align: center;
    }
    .metric .label {
      font-size: 20px;
      font-weight: 700;
      color: #64748b;
    }
    .metric .value {
      margin-top: 10px;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .metric .note {
      margin-top: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--teal);
    }
    .dots {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #d1fae5;
    }
    .dot.on { background: var(--teal); }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 28px;
    }
    .chip {
      font-size: 24px;
      font-weight: 800;
      color: var(--teal);
      background: #fff;
      border: 1px solid rgba(15, 118, 110, 0.16);
      border-radius: 999px;
      padding: 14px 22px;
      box-shadow: 0 8px 24px rgba(15, 118, 110, 0.08);
    }
    .cta {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 0 40px;
      border-radius: 18px;
      background: var(--teal);
      color: #fff;
      font-size: 30px;
      font-weight: 900;
      box-shadow: 0 16px 40px rgba(15, 118, 110, 0.28);
    }
    .url {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 800;
      color: var(--muted);
    }
    .note {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 600;
      color: #64748b;
    }
    .footer-brand {
      position: absolute;
      bottom: 48px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 2;
    }
    .footer-brand svg { width: 36px; height: 36px; }
    .footer-brand span {
      font-size: 22px;
      font-weight: 800;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true"></div>

  <!-- Scene 1 -->
  <section class="scene s1">
    <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 18,8 L 38,8 L 38,48 A 30,30 0 0,1 18,62 Z" fill="#1e293b"/>
      <path d="M 38,22 L 54,22 A 34,34 0 0,1 88,56 A 34,34 0 0,1 54,90 L 38,90 L 38,68 L 54,68 A 12,12 0 0,0 66,56 A 12,12 0 0,0 54,44 L 38,44 Z" fill="#1e293b"/>
      <path d="M 26,74 L 30,74 L 30,90 L 26,90 Z" fill="#10b981"/>
      <path d="M 27,74 C 14,74 10,63 12,56 C 18,56 26,64 27,74 Z" fill="#10b981"/>
      <path d="M 29,72 C 42,65 46,52 45,44 C 35,46 28,59 29,72 Z" fill="#10b981"/>
    </svg>
    <h1 class="brand">補亦樂乎</h1>
    <p class="eyebrow">地區教育情報</p>
    <p class="sub" style="margin-top:28px">地圖找班之外，也能先看各行政區全貌</p>
  </section>

  <!-- Scene 2：密度選區 -->
  <section class="scene s2">
    <h2 class="headline">先選縣市，再點行政區</h2>
    <p class="sub">密度圖一眼看出哪區班數較多</p>
    <div class="map-card" aria-hidden="true">
      <div class="title-row">
        <div class="title">台中市 · 行政區密度</div>
        <div class="hint">點選切換情報</div>
      </div>
      <div class="grid">
        <div class="cell c2"><span>北屯</span><span class="n">312</span></div>
        <div class="cell c5 pick"><span>西屯</span><span class="n">418</span></div>
        <div class="cell c3"><span>南屯</span><span class="n">256</span></div>
        <div class="cell c4"><span>北區</span><span class="n">198</span></div>
        <div class="cell c1"><span>東區</span><span class="n">92</span></div>
        <div class="cell c2"><span>西區</span><span class="n">140</span></div>
        <div class="cell c3"><span>南區</span><span class="n">168</span></div>
        <div class="cell c1"><span>中區</span><span class="n">54</span></div>
        <div class="cell c2"><span>太平</span><span class="n">121</span></div>
        <div class="cell c1"><span>大里</span><span class="n">108</span></div>
      </div>
      <div class="legend">
        <span>密度低</span>
        <div class="legend-bar"></div>
        <span>密度高</span>
      </div>
    </div>
  </section>

  <!-- Scene 3：本區重點 -->
  <section class="scene s3">
    <p class="eyebrow" style="margin-bottom:10px">西屯區重點</p>
    <h2 class="headline">立案、密度、公開稽查<br>一次對照</h2>
    <div class="metrics" aria-hidden="true">
      <div class="metric">
        <div class="label">立案</div>
        <div class="value">418</div>
        <div class="note">占全市約 15%</div>
      </div>
      <div class="metric">
        <div class="label">資源充沛</div>
        <div class="value" style="font-size:36px;margin-top:18px">較高</div>
        <div class="dots">
          <span class="dot on"></span>
          <span class="dot on"></span>
          <span class="dot on"></span>
          <span class="dot on"></span>
          <span class="dot"></span>
        </div>
      </div>
      <div class="metric">
        <div class="label">有稽查</div>
        <div class="value">12%</div>
        <div class="note">公開紀錄占比</div>
      </div>
    </div>
  </section>

  <!-- Scene 4：CTA -->
  <section class="scene s4">
    <h2 class="headline">三縣市都能看情報</h2>
    <p class="sub">不排行、不聳動，用公開資料幫你比較</p>
    <div class="chips">
      <span class="chip">台中市</span>
      <span class="chip">新北市</span>
      <span class="chip">高雄市</span>
    </div>
    <div class="cta">打開地區情報</div>
    <div class="url">boho.yujii.app</div>
    <p class="note">底欄「情報」· 公開資料優先</p>
  </section>

  <div class="footer-brand" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 18,8 L 38,8 L 38,48 A 30,30 0 0,1 18,62 Z" fill="#1e293b"/>
      <path d="M 38,22 L 54,22 A 34,34 0 0,1 88,56 A 34,34 0 0,1 54,90 L 38,90 L 38,68 L 54,68 A 12,12 0 0,0 66,56 A 12,12 0 0,0 54,44 L 38,44 Z" fill="#1e293b"/>
      <path d="M 26,74 L 30,74 L 30,90 L 26,90 Z" fill="#10b981"/>
      <path d="M 27,74 C 14,74 10,63 12,56 C 18,56 26,64 27,74 Z" fill="#10b981"/>
      <path d="M 29,72 C 42,65 46,52 45,44 C 35,46 28,59 29,72 Z" fill="#10b981"/>
    </svg>
    <span>補亦樂乎</span>
  </div>
</body>
</html>
