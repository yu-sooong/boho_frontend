<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1350px;
      font-family: "Noto Sans TC", Inter, system-ui, sans-serif;
      overflow: hidden;
      position: relative;
      background: #f4f7f6;
      color: #0b1220;
    }

    /* Blurred oversized map background */
    .bg-map {
      position: absolute;
      inset: -8%;
      background:
        linear-gradient(160deg, #d1fae5 0%, #e2e8f0 40%, #ccfbf1 70%, #f1f5f9 100%);
      filter: blur(18px) saturate(1.05);
      transform: scale(1.08);
    }
    .bg-map::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(15,124,115,.07) 2px, transparent 2px),
        linear-gradient(90deg, rgba(15,124,115,.07) 2px, transparent 2px);
      background-size: 72px 72px;
    }
    .bg-wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% 20%, rgba(255,255,255,.82), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.55), rgba(244,247,246,.88) 55%, #f4f7f6 100%);
    }

    .glow-pin {
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #0f7c73;
      box-shadow: 0 0 0 10px rgba(15,124,115,.12), 0 0 40px rgba(15,124,115,.45);
      filter: blur(0.2px);
      opacity: .85;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 72px 56px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 1.12;
      max-width: 920px;
      color: #0b1220;
    }

    .desc {
      margin-top: 28px;
      font-size: 22px;
      font-weight: 600;
      color: #64748b;
    }

    .checks {
      margin-top: 18px;
      display: grid;
      gap: 12px;
      justify-items: start;
      text-align: left;
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
    }
    .checks div { display: flex; align-items: center; gap: 12px; }
    .checks .ok {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(15,124,115,.12); color: #0f7c73;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 900;
    }

    .phone-wrap {
      margin-top: 40px;
      position: relative;
      width: 380px;
      height: 760px;
      filter: drop-shadow(0 50px 80px rgba(15,23,42,.22));
    }
    .phone {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #222833, #0f141d);
      border-radius: 54px;
      padding: 14px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset;
    }
    .screen {
      height: 100%;
      border-radius: 42px;
      overflow: hidden;
      background: #fff;
      position: relative;
    }
    .notch {
      position: absolute;
      top: 12px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 28px;
      background: #0f141d;
      border-radius: 20px;
      z-index: 3;
    }
    .app-top {
      padding: 52px 18px 14px;
      background: linear-gradient(180deg, #fff, #f8fafc);
      border-bottom: 1px solid #eef2f7;
      text-align: left;
    }
    .app-brand {
      font-size: 15px; font-weight: 900; color: #0f7c73; letter-spacing: .02em;
    }
    .app-search {
      margin-top: 12px;
      background: #f1f5f9;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
    }
    .app-map {
      position: absolute;
      inset: 150px 0 0;
      background:
        radial-gradient(circle at 30% 30%, rgba(16,185,129,.18), transparent 40%),
        linear-gradient(160deg, #ecfdf5, #e2e8f0 55%, #f8fafc);
    }
    .app-map .pin {
      position: absolute;
      width: 32px; height: 42px;
      filter: drop-shadow(0 8px 12px rgba(15,23,42,.25));
    }
    .cluster {
      position: absolute;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #0f7c73;
      color: #fff;
      font-weight: 900;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid #fff;
      box-shadow: 0 10px 24px rgba(15,124,115,.35), 0 0 0 8px rgba(15,124,115,.10);
    }
    .cluster.pen { box-shadow: 0 0 0 4px #d97706, 0 10px 24px rgba(15,124,115,.35); }
    .sheet {
      position: absolute;
      left: 14px; right: 14px; bottom: 18px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 24px;
      padding: 18px;
      text-align: left;
      box-shadow: 0 20px 40px rgba(15,23,42,.16);
      backdrop-filter: blur(14px);
    }
    .sheet b { display: block; font-size: 18px; font-weight: 900; line-height: 1.25; }
    .sheet .meta { margin-top: 6px; font-size: 14px; color: #64748b; font-weight: 600; }
    .sheet .row {
      margin-top: 12px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sheet .rating { color: #b45309; font-weight: 800; font-size: 15px; }
    .sheet .cta {
      background: #0f7c73; color: #fff;
      font-size: 13px; font-weight: 800;
      padding: 8px 14px; border-radius: 999px;
    }

    .foot {
      margin-top: auto;
      padding-top: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .foot .url {
      font-size: 22px;
      font-weight: 800;
      color: #0f7c73;
      letter-spacing: -0.01em;
    }
    .foot .mark {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 900; color: #0b1220;
    }
    .foot .mark svg { width: 32px; height: 32px; }
  </style>
</head>
<body>
  <div class="bg-map"></div>
  <div class="bg-wash"></div>
  <div class="glow-pin" style="left:12%;top:22%"></div>
  <div class="glow-pin" style="left:78%;top:18%;background:#0369a1;box-shadow:0 0 0 10px rgba(3,105,161,.12),0 0 40px rgba(3,105,161,.4)"></div>
  <div class="glow-pin" style="left:20%;top:70%;background:#d97706;box-shadow:0 0 0 10px rgba(217,119,6,.12),0 0 40px rgba(217,119,6,.35)"></div>
  <div class="glow-pin" style="left:85%;top:62%"></div>

  <div class="content">
    <h1>補習班 Google Maps，<br/>終於有人做了。</h1>
    <div class="desc">查看</div>
    <div class="checks">
      <div><span class="ok">✓</span>官方立案</div>
      <div><span class="ok">✓</span>家長評價</div>
      <div><span class="ok">✓</span>稽查紀錄</div>
      <div><span class="ok">✓</span>地圖搜尋</div>
    </div>

    <div class="phone-wrap">
      <div class="phone">
        <div class="screen">
          <div class="notch"></div>
          <div class="app-top">
            <div class="app-brand">補亦樂乎</div>
            <div class="app-search">搜尋補習班名稱或地址</div>
          </div>
          <div class="app-map">
            <div class="cluster" style="left:48px;top:70px">18</div>
            <div class="cluster pen" style="left:180px;top:140px">42</div>
            <div class="cluster" style="left:90px;top:250px;width:44px;height:44px;font-size:15px">9</div>
            <svg class="pin" style="left:250px;top:60px" viewBox="0 0 28 36"><path fill="#0369a1" d="M14 0C6.27 0 0 6.27 0 14c0 4.83 2.46 9.1 6.22 11.67L14 36l7.78-10.33C25.54 23.1 28 18.83 28 14 28 6.27 21.73 0 14 0z"/></svg>
            <svg class="pin" style="left:40px;top:200px" viewBox="0 0 28 36"><path fill="#0f7c73" d="M14 0C6.27 0 0 6.27 0 14c0 4.83 2.46 9.1 6.22 11.67L14 36l7.78-10.33C25.54 23.1 28 18.83 28 14 28 6.27 21.73 0 14 0z"/></svg>
            <svg class="pin" style="left:220px;top:280px" viewBox="0 0 28 36"><path fill="#d97706" d="M14 0C6.27 0 0 6.27 0 14c0 4.83 2.46 9.1 6.22 11.67L14 36l7.78-10.33C25.54 23.1 28 18.83 28 14 28 6.27 21.73 0 14 0z"/></svg>
          </div>
          <div class="sheet">
            <b>私立何嘉仁美語短期補習班</b>
            <div class="meta">西屯區 · 官方立案</div>
            <div class="row">
              <span class="rating">★ 4.6 家長評價</span>
              <span class="cta">查看詳情</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="foot">
      <div class="mark">
        <svg viewBox="0 0 100 100" fill="none"><path d="M 18,8 L 38,8 L 38,48 A 30,30 0 0,1 18,62 Z" fill="#1e293b"/><path d="M 38,22 L 54,22 A 34,34 0 0,1 88,56 A 34,34 0 0,1 54,90 L 38,90 L 38,68 L 54,68 A 12,12 0 0,0 66,56 A 12,12 0 0,0 54,44 L 38,44 Z" fill="#1e293b"/><path d="M 26,74 L 30,74 L 30,90 L 26,90 Z" fill="#10b981"/><path d="M 27,74 C 14,74 10,63 12,56 C 18,56 26,64 27,74 Z" fill="#10b981"/><path d="M 29,72 C 42,65 46,52 45,44 C 35,46 28,59 29,72 Z" fill="#10b981"/></svg>
        BOHO
      </div>
      <div class="url">boho.yujii.app</div>
    </div>
  </div>
</body>
</html>
