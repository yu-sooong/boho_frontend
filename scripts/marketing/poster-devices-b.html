<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px; height: 1080px;
      font-family: "Noto Sans TC", sans-serif;
      background: #0f766e;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 85% 15%, rgba(255,255,255,.14), transparent 35%),
        radial-gradient(circle at 10% 80%, rgba(16,185,129,.35), transparent 40%);
    }
    .top {
      position: relative; z-index: 2;
      padding: 48px 48px 0;
    }
    .brand { font-size: 24px; font-weight: 800; opacity: .92; letter-spacing: .04em; }
    h1 {
      margin-top: 16px;
      font-size: 52px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.03em;
    }
    .sub { margin-top: 12px; font-size: 24px; font-weight: 500; opacity: .92; max-width: 640px; }

    .stage {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 720px;
      z-index: 1;
    }

    /* Desktop tilted */
    .desk {
      position: absolute;
      left: 28px;
      bottom: 70px;
      width: 680px;
      transform: rotate(-4deg);
      z-index: 2;
    }
    .desk-frame {
      background: #0f172a;
      border-radius: 16px;
      padding: 11px;
      box-shadow: 0 40px 80px rgba(0,0,0,.35);
    }
    .desk-ui {
      height: 390px;
      border-radius: 8px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 210px 1fr;
      background: #fff;
      color: #0f172a;
    }
    .side {
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
      padding: 10px 8px;
      font-size: 10px;
    }
    .search {
      background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 7px 8px; color: #94a3b8; font-weight: 600; margin-bottom: 8px;
    }
    .stat {
      font-weight: 900; color: #0f766e; font-size: 13px; margin-bottom: 8px;
    }
    .row {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 9px;
      padding: 8px; margin-bottom: 7px;
    }
    .row b { display: block; font-size: 11px; font-weight: 800; line-height: 1.25; }
    .row span { color: #64748b; font-size: 9px; font-weight: 500; }
    .pill {
      display: inline-block; margin-top: 4px;
      background: #ecfdf5; color: #0f766e; border: 1px solid #99f6e4;
      border-radius: 999px; padding: 1px 6px; font-size: 9px; font-weight: 700;
    }
    .map {
      position: relative;
      background: linear-gradient(160deg, #d1fae5, #e2e8f0 40%, #f1f5f9);
      overflow: hidden;
    }
    .block {
      position: absolute; background: rgba(255,255,255,.55);
      border: 1px solid rgba(148,163,184,.35); border-radius: 4px;
    }
    .road { position: absolute; background: #fff; }
    .road.h { height: 8px; left: 0; right: 0; }
    .road.v { width: 8px; top: 0; bottom: 0; }
    .water {
      position: absolute; background: rgba(56,189,248,.35);
      border-radius: 50px; transform: rotate(25deg);
    }
    .green {
      position: absolute; background: rgba(16,185,129,.22); border-radius: 30%;
    }
    .cluster {
      position: absolute; border-radius: 50%; color: #fff; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid #fff;
      box-shadow: 0 4px 12px rgba(15,118,110,.4);
    }
    .cluster.a { width: 48px; height: 48px; font-size: 15px; background: #0d9488; }
    .cluster.b { width: 60px; height: 60px; font-size: 17px; background: #0f766e; }
    .cluster.c { width: 40px; height: 40px; font-size: 13px; background: #115e59; }
    .cluster.pen { box-shadow: 0 0 0 3px #d97706, 0 4px 12px rgba(15,118,110,.4); }
    .pin { position: absolute; width: 20px; height: 26px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
    .popup {
      position: absolute; right: 14px; top: 14px;
      width: 160px; background: #fff; border-radius: 12px;
      padding: 10px; box-shadow: 0 10px 24px rgba(15,23,42,.18);
      font-size: 10px;
    }
    .popup b { display: block; font-size: 12px; font-weight: 900; line-height: 1.3; }
    .popup .d { margin-top: 3px; color: #64748b; font-weight: 500; }
    .popup .badge {
      margin-top: 6px; display: inline-block;
      background: #fff7ed; color: #b45309; border: 1px solid #fdba74;
      border-radius: 999px; padding: 2px 7px; font-weight: 800; font-size: 9px;
    }
    .legend {
      position: absolute; left: 10px; bottom: 10px;
      background: rgba(255,255,255,.95); border-radius: 10px;
      padding: 8px 10px; font-size: 10px; font-weight: 700; color: #475569;
      line-height: 1.5;
    }

    /* Phone upright */
    .phone {
      position: absolute;
      right: 56px;
      bottom: 90px;
      width: 270px; height: 560px;
      background: #020617;
      border-radius: 40px;
      padding: 11px;
      z-index: 4;
      box-shadow: 0 40px 70px rgba(0,0,0,.4);
      transform: rotate(8deg);
    }
    .phone-ui {
      height: 100%; border-radius: 30px; overflow: hidden;
      background: #fff; color: #0f172a; position: relative;
    }
    .ph-top {
      height: 96px; padding: 12px 12px 8px;
      background: linear-gradient(180deg, #fff, #f8fafc);
      border-bottom: 1px solid #e2e8f0;
    }
    .ph-brand { font-size: 13px; font-weight: 900; color: #0f766e; }
    .ph-search {
      margin-top: 8px; background: #f1f5f9; border-radius: 10px;
      padding: 8px 10px; font-size: 11px; font-weight: 600; color: #94a3b8;
    }
    .ph-chips { margin-top: 8px; display: flex; gap: 6px; }
    .ph-chips i {
      font-style: normal; font-size: 10px; font-weight: 800;
      background: #ecfdf5; color: #0f766e; border: 1px solid #99f6e4;
      border-radius: 999px; padding: 3px 8px;
    }
    .ph-map { position: absolute; inset: 96px 0 0; }
    .ph-fab {
      position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
      background: #0f766e; color: #fff; font-size: 12px; font-weight: 800;
      padding: 9px 14px; border-radius: 999px; white-space: nowrap;
      box-shadow: 0 8px 18px rgba(15,118,110,.4);
    }

    .footer {
      position: absolute; left: 48px; right: 48px; bottom: 36px;
      z-index: 5; display: flex; justify-content: space-between; align-items: center;
    }
    .cta {
      background: #10b981; color: #042f2e;
      font-size: 24px; font-weight: 900;
      padding: 14px 26px; border-radius: 999px;
    }
    .url { font-size: 22px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">補亦樂乎 · BOHO</div>
    <h1>地圖上直接看<br/>立案、稽查、評價</h1>
    <p class="sub">電腦放大比較行政區，手機外出當場查——同一套台中補教資料。</p>
  </div>

  <div class="stage">
    <div class="desk">
      <div class="desk-frame">
        <div class="desk-ui">
          <div class="side">
            <div class="search">西屯區 · 文理類</div>
            <div class="stat">篩選後 214 間</div>
            <div class="row"><b>私立巨匠電腦短期補習班</b><span>西屯區河南路</span><br/><span class="pill">資訊類</span></div>
            <div class="row"><b>私立何嘉仁美語短期補習班</b><span>西屯區台灣大道</span><br/><span class="pill">外語類</span></div>
            <div class="row"><b>私立科見美語短期補習班</b><span>南屯區公益路</span><br/><span class="pill">外語類</span></div>
            <div class="row"><b>私立佳音英語短期補習班</b><span>北屯區崇德路</span><br/><span class="pill">外語類</span></div>
          </div>
          <div class="map">
            <div class="green" style="width:100px;height:70px;left:30px;top:30px"></div>
            <div class="green" style="width:80px;height:60px;right:40px;top:180px"></div>
            <div class="water" style="width:180px;height:24px;left:140px;top:100px"></div>
            <div class="block" style="width:50px;height:40px;left:70px;top:140px"></div>
            <div class="block" style="width:60px;height:35px;left:200px;top:200px"></div>
            <div class="block" style="width:45px;height:50px;left:300px;top:80px"></div>
            <div class="road h" style="top:70px"></div>
            <div class="road h" style="top:160px"></div>
            <div class="road h" style="top:250px"></div>
            <div class="road v" style="left:90px"></div>
            <div class="road v" style="left:220px"></div>
            <div class="road v" style="left:340px"></div>
            <div class="cluster b pen" style="left:120px;top:90px">41</div>
            <div class="cluster a" style="left:260px;top:40px">19</div>
            <div class="cluster c pen" style="left:60px;top:220px">11</div>
            <div class="cluster a" style="left:300px;top:240px">23</div>
            <svg class="pin" style="left:180px;top:180px" viewBox="0 0 28 36"><path fill="#0f766e" d="M14 0C6.27 0 0 6.27 0 14c0 4.83 2.46 9.1 6.22 11.67L14 36l7.78-10.33C25.54 23.1 28 18.83 28 14 28 6.27 21.73 0 14 0z"/></svg>
            <svg class="pin" style="left:360px;top:120px" viewBox="0 0 28 36"><path fill="#0369a1" d="M14 0C6.27 0 0 6.27 0 14c0 4.83 2.46 9.1 6.22 11.67L14 36l7.78-10.33C25.54 23.1 28 18.83 28 14 28 6.27 21.73 0 14 0z"/></svg>
            <svg class="pin" style="left:40px;top:120px" viewBox="0 0 28 36"><path fill="#7c3aed" d="M14 0C6.27 0 0 6.27 0 14c0 4.83 2.46 9.1 6.22 11.67L14 36l7.78-10.33C25.54 23.1 28 18.83 28 14 28 6.27 21.73 0 14 0z"/></svg>
            <div class="popup">
              <b>私立何嘉仁美語短期補習班</b>
              <div class="d">西屯區 · 外語類</div>
              <div class="badge">有稽查紀錄</div>
            </div>
            <div class="legend">叢集數字＝附近班數<br/>橘外圈＝有稽查</div>
          </div>
        </div>
      </div>
    </div>

    <div class="phone">
      <div class="phone-ui">
        <div class="ph-top">
          <div class="ph-brand">補亦樂乎</div>
          <div class="ph-search">搜尋補習班名稱或地址</div>
          <div class="ph-chips"><i>西屯區</i><i>外語類</i><i>有稽查</i></div>
        </div>
        <div class="ph-map map">
          <div class="green" style="width:80px;height:55px;left:20px;top:40px"></div>
          <div class="water" style="width:140px;height:18px;left:50px;top:160px"></div>
          <div class="road h" style="top:90px"></div>
          <div class="road h" style="top:200px"></div>
          <div class="road v" style="left:70px"></div>
          <div class="road v" style="left:160px"></div>
          <div class="cluster b pen" style="left:50px;top:100px">33</div>
          <div class="cluster a" style="left:140px;top:200px">14</div>
          <div class="cluster c" style="left:30px;top:260px">7</div>
          <svg class="pin" style="left:170px;top:80px" viewBox="0 0 28 36"><path fill="#0369a1" d="M14 0C6.27 0 0 6.27 0 14c0 4.83 2.46 9.1 6.22 11.67L14 36l7.78-10.33C25.54 23.1 28 18.83 28 14 28 6.27 21.73 0 14 0z"/></svg>
          <svg class="pin" style="left:90px;top:300px" viewBox="0 0 28 36"><path fill="#0f766e" d="M14 0C6.27 0 0 6.27 0 14c0 4.83 2.46 9.1 6.22 11.67L14 36l7.78-10.33C25.54 23.1 28 18.83 28 14 28 6.27 21.73 0 14 0z"/></svg>
          <div class="ph-fab">查看 214 間補習班</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="cta">打開地圖</div>
    <div class="url">boho.yujii.app</div>
  </div>
</body>
</html>
