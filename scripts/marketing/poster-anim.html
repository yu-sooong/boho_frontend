<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: "Noto Sans TC", sans-serif;
      background: #ecfdf5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 640px;
      height: 640px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16,185,129,.22), transparent 65%);
      animation: pulse 2.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.92); opacity: .7; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .card {
      position: relative;
      width: 860px;
      background: #fff;
      border-radius: 36px;
      padding: 56px 52px 48px;
      box-shadow: 0 30px 80px rgba(15, 118, 110, 0.14);
      text-align: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      animation: pop 1.2s ease both;
    }
    @keyframes pop {
      from { transform: scale(.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .line {
      overflow: hidden;
      height: 1.25em;
      margin: 0 auto;
    }
    h1 {
      font-size: 56px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.03em;
      animation: rise 0.8s 0.15s ease both;
    }
    .swap {
      margin-top: 18px;
      height: 52px;
      position: relative;
      overflow: hidden;
    }
    .swap span {
      position: absolute;
      inset: 0;
      font-size: 34px;
      font-weight: 800;
      color: #0f766e;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(18px);
      animation: slide 6s infinite;
    }
    .swap span:nth-child(1) { animation-delay: 0s; }
    .swap span:nth-child(2) { animation-delay: 2s; }
    .swap span:nth-child(3) { animation-delay: 4s; }
    @keyframes slide {
      0%, 8% { opacity: 0; transform: translateY(18px); }
      14%, 30% { opacity: 1; transform: translateY(0); }
      36%, 100% { opacity: 0; transform: translateY(-18px); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cta {
      margin-top: 36px;
      display: inline-flex;
      background: #0f766e;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      padding: 16px 36px;
      border-radius: 999px;
      animation: rise 0.8s 0.35s ease both;
    }
    .url {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 700;
      color: #64748b;
      animation: rise 0.8s 0.45s ease both;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 18,8 L 38,8 L 38,48 A 30,30 0 0,1 18,62 Z" fill="#1e293b"/>
      <path d="M 38,22 L 54,22 A 34,34 0 0,1 88,56 A 34,34 0 0,1 54,90 L 38,90 L 38,68 L 54,68 A 12,12 0 0,0 66,56 A 12,12 0 0,0 54,44 L 38,44 Z" fill="#1e293b"/>
      <path d="M 26,74 L 30,74 L 30,90 L 26,90 Z" fill="#10b981"/>
      <path d="M 27,74 C 14,74 10,63 12,56 C 18,56 26,64 27,74 Z" fill="#10b981"/>
      <path d="M 29,72 C 42,65 46,52 45,44 C 35,46 28,59 29,72 Z" fill="#10b981"/>
    </svg>
    <h1>補亦樂乎</h1>
    <div class="swap">
      <span>先看立案，再決定要不要報名</span>
      <span>地圖標示稽查紀錄</span>
      <span>歡迎留下家長／學生評價</span>
    </div>
    <div class="cta">打開地圖查詢</div>
    <div class="url">boho.yujii.app</div>
  </div>
</body>
</html>
